<!DOCTYPE html><html><head><meta charset="utf-8"><link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet"><style>
:root{--coal:#16110c;--soot:#211913;--pit:#0e0a07;--line:rgba(244,235,223,.10);
--cream:#f4ebdf;--ash:#a5937f;--flame:#ff6b35;--gold:#ffb454;
--display:"Bricolage Grotesque",system-ui,sans-serif;--body:"IBM Plex Sans",system-ui,sans-serif;
--mono:"IBM Plex Mono",ui-monospace,monospace}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--coal);color:var(--cream);font-family:var(--body);line-height:1.65;padding:2.5rem}
a{color:var(--gold);text-decoration:none}
code{font-family:var(--mono);color:var(--gold);font-size:.92em}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:1.2rem;max-width:760px}
.chip{height:72px;border-radius:10px;border:1px solid var(--line);margin-bottom:.5rem}
.sw p{font-size:.8rem;color:var(--ash)} .sw code{font-size:.75rem}</style></head><body><div class="grid"><div class="sw"><div class="chip" style="background:var(--coal)"></div><p>coal — page</p><code>#16110C</code></div><div class="sw"><div class="chip" style="background:var(--soot)"></div><p>soot — cards</p><code>#211913</code></div><div class="sw"><div class="chip" style="background:var(--pit)"></div><p>pit — terminals</p><code>#0E0A07</code></div><div class="sw"><div class="chip" style="background:var(--cream)"></div><p>cream — text</p><code>#F4EBDF</code></div><div class="sw"><div class="chip" style="background:var(--ash)"></div><p>ash — muted</p><code>#A5937F</code></div><div class="sw"><div class="chip" style="background:var(--flame)"></div><p>flame — brand</p><code>#FF6B35</code></div><div class="sw"><div class="chip" style="background:var(--gold)"></div><p>gold — links</p><code>#FFB454</code></div></div></body></html>
